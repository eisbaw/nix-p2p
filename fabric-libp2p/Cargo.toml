[package]
name = "fabric-libp2p"
description = "nix-p2p libp2p BACKEND behind the peer-fabric seam: the MANDATORY decentralized content-discovery layer (libp2p-kad ProviderDirectory / AvailabilityAnnouncer over the frozen ContentKey/ProviderRecord codec). Depends on peer-fabric, never on daemon-core. The libp2p NAR transfer/serve + node discovery is TASK-151."
version.workspace = true
edition.workspace = true

[lib]
name = "fabric_libp2p"
path = "src/lib.rs"

[dependencies]
# peer-fabric (TASK-140/141): the seam this backend implements, and the canonical
# home of the FROZEN value types (ContentKey, ProviderRecord, record_codec, NodeId,
# Blake3Digest). This crate NEVER depends on the daemon; the only cross edge is
# daemon -> fabric-libp2p.
peer-fabric = { path = "../peer-fabric" }
# proc-supervisor (TASK-146/158): stack-neutral killable OS process groups +
# TaskSupervisor, shared with fabric-iroh. The real-node NAR supplier regenerates a
# raw NAR on demand by running `nix-store --dump` / a raw-NAR helper in an OWNED
# process group so node shutdown reaps it (no unkillable worker). ZERO p2p deps and
# NOT daemon-core, so the crate graph (daemon -> fabric-libp2p) and
# scripts/check-independence.py stay green.
proc-supervisor = { path = "../proc-supervisor" }
# rust-libp2p (TASK-103, owner libp2p-PRIMARY): the robust existing Kademlia
# implementation. We do NOT hand-roll Kademlia and do NOT run kad-over-iroh. Feature
# set per the task: kad (the DHT), tcp+quic (transports), identify (so peers learn
# each other's listen addrs for kad routing), request-response (the record/transfer
# carrier, wired in TASK-151), tokio+macros (the runtime + NetworkBehaviour derive),
# noise (auth) + yamux (mux over tcp).
#
# NAT traversal (TASK-168): autonat (reachability detection - am I publicly dialable?),
# dcutr (DCUtR direct-connection-upgrade-through-relay hole punching), relay (circuit-v2
# - this node as a relay CLIENT so a NAT'd peer stays reachable via a relay, AND as a
# relay SERVER so any public node helps NAT'd peers with no dedicated infrastructure).
# These are DIAL-ASSISTANCE, not discovery: they change HOW we reach a peer already
# discovered via kad, never HOW we find who holds content (see
# scripts/check-discovery-no-shortcut.py rationale).
libp2p = { version = "0.56", default-features = false, features = [
    "kad",
    "tcp",
    "quic",
    "identify",
    "request-response",
    "tokio",
    "macros",
    "noise",
    "yamux",
    "autonat",
    "dcutr",
    "relay",
] }
# libp2p-stream (TASK-157): the RAW-STREAM NAR transfer (AsyncRead/AsyncWrite per
# call) that REPLACES the request-response NAR carrier. The libp2p 0.56 meta-crate
# does not re-export a `stream` feature, so the crate is pulled directly; it is
# pinned to the version whose libp2p-swarm/libp2p-core reqs match the locked
# libp2p 0.56.0 (swarm 0.47 / core 0.43.1). TASK-236 bumped this from 0.2.0-alpha
# (which matched libp2p 0.54's swarm 0.45 / core 0.42) so the resolver keeps the
# whole libp2p stack on one swarm/core generation. This gives the swarm a `stream::Behaviour`
# whose `Control` opens/accepts raw substreams OFF the poll loop, so the fetcher
# aborts mid-stream at exactly the signed size, enforces a real inter-chunk idle
# bound, and a large serve never blocks kad. Stays on the libp2p side
# (check-independence green: testproxy shares none of it).
libp2p-stream = "0.4.0-alpha"
# The single-threaded Swarm is driven from a dedicated worker task; the directory /
# announcer talk to it over tokio channels (mpsc command in, oneshot reply out).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
# The capability traits are async; async_trait boxes every call (the seam already
# pays this, see fabric.rs).
async-trait = "0.1"
# The Swarm is a Stream/futures object; StreamExt::select_next_some is how libp2p's
# own examples drive it. Already in the libp2p closure.
futures = "0.3"
# The composite value-record key is a domain-separated derive_key over
# ContentKey||PeerId (see the crate ADR); blake3 is already in the peer-fabric
# closure (the ContentKey recipe itself is blake3 derive_key).
blake3 = "1"
# Structured, level-appropriate logging of swarm/kad events (fail verbosely).
tracing = "0.1"
# TASK-214: a FRESH per-query u64 SALT for the provider fan-out selection, drawn from
# the OS CSPRNG (`rand::random`) so the salt is UNPREDICTABLE to a griefer and is fixed
# only AFTER the attacker's identities are minted. This is what makes the retained
# fan-out subset non-grindable and self-healing across retries (see swarm.rs
# `provider_rank`). `rand` is already in the tree via libp2p 0.54 (0.8.x); pinning it
# here is the direct edge. The salt is the ONLY randomness in the path and it is an
# integer (u64) - no float ever enters the selection decision (owner no-floats rule).
rand = "0.8"
# The announcer SIGNS its own ProviderWithdrawal tombstones (TASK-152, AC#1) with the
# SAME ed25519 secret that IS this node's identity (self-serve v1: a node only ever
# withdraws records it itself signed). `sign_provider_withdrawal` takes an
# ed25519-dalek `SigningKey`; "3" matches peer-fabric's, so it is the one shared type.
ed25519-dalek = "3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing-subscriber = "0.3"
# The multi-node test signs ProviderRecords with the SAME ed25519 the node identity is
# built from (self-serve); ed25519-dalek "3" matches peer-fabric's, so SigningKey is
# the one shared type across the seam.
ed25519-dalek = "3"

[lints]
workspace = true
