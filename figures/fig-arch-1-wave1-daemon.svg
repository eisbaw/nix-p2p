<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="710" viewBox="0 0 1180 710" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1180" height="710" fill="#ffffff"/>

  <text x="20" y="32" font-size="18" font-weight="bold" fill="#222">nix-p2p — wave-1 daemon architecture (transparent proxy behind frozen seams)</text>
  <text x="20" y="52" font-size="12" fill="#666">All capability sits behind NarinfoSource / NarSource; wave 1 implements them with upstream HTTP plus an opt-in narinfo disk cache. Wave 2 adds p2p impls, not serving-layer changes.</text>

  <!-- external: nix client -->
  <rect x="20" y="300" width="140" height="110" rx="6" fill="#f2f2f2" stroke="#777"/>
  <text x="30" y="320" font-size="13" font-weight="bold" fill="#222">Nix client</text>
  <text x="30" y="337" font-size="11" fill="#333">unmodified nix<tspan x="30" dy="14">re-verifies Sig +</tspan><tspan x="30" dy="14">NarHash itself —</tspan><tspan x="30" dy="14">daemon outside the</tspan><tspan x="30" dy="14">trusted computing base</tspan></text>

  <!-- daemon container -->
  <rect x="200" y="80" width="680" height="580" rx="8" fill="#fbfcfe" stroke="#4a6fa5"/>
  <text x="212" y="100" font-size="13" font-weight="bold" fill="#4a6fa5">daemon — the product (Rust / tokio, daemon/src)</text>

  <!-- cacheinfo -->
  <rect x="220" y="130" width="160" height="95" rx="6" fill="#e8eef7" stroke="#4a6fa5"/>
  <text x="230" y="148" font-size="12" font-weight="bold" fill="#222">nix-cache-info</text>
  <text x="230" y="164" font-size="11" fill="#333">cacheinfo.rs — served<tspan x="230" dy="14">locally. Priority 30 beats</tspan><tspan x="230" dy="14">upstream's 40: daemon is</tspan><tspan x="230" dy="14">tried FIRST, upstream is</tspan><tspan x="230" dy="14">the fallback</tspan></text>

  <!-- server -->
  <rect x="220" y="300" width="160" height="110" rx="6" fill="#e8eef7" stroke="#4a6fa5"/>
  <text x="230" y="318" font-size="12" font-weight="bold" fill="#222">HTTP server</text>
  <text x="230" y="334" font-size="11" fill="#333">server.rs — classifies:<tspan x="230" dy="14">/nix-cache-info,</tspan><tspan x="230" dy="14">*.narinfo, nar/&lt;token&gt;,</tspan><tspan x="230" dy="14">other; streams bodies</tspan><tspan x="230" dy="14">with length checks</tspan></text>

  <!-- narinfo seam -->
  <rect x="450" y="110" width="220" height="120" rx="6" fill="#e8eef7" stroke="#4a6fa5"/>
  <text x="460" y="128" font-size="12" font-weight="bold" fill="#222">NarinfoSource (frozen seam)</text>
  <text x="460" y="144" font-size="11" fill="#333">NarinfoDiskCache (task-8):<tspan x="460" dy="14">byte-verbatim, Nix TTLs</tspan><tspan x="460" dy="14">(30 d / 1 h), atomic rename,</tspan><tspan x="460" dy="14">layered over UpstreamHttp.</tspan><tspan x="460" dy="14">OFF by default until task-29</tspan></text>

  <!-- rewrite -->
  <rect x="700" y="190" width="150" height="95" rx="6" fill="#ffffff" stroke="#4a6fa5"/>
  <text x="710" y="208" font-size="12" font-weight="bold" fill="#222">rewrite::apply</text>
  <text x="710" y="224" font-size="11" fill="#333">transport-field<tspan x="710" dy="14">allowlist EMPTY in</tspan><tspan x="710" dy="14">wave 1 — narinfo is</tspan><tspan x="710" dy="14">byte-verbatim</tspan></text>

  <!-- catalog -->
  <rect x="450" y="310" width="220" height="110" rx="6" fill="#e8eef7" stroke="#4a6fa5"/>
  <text x="460" y="328" font-size="12" font-weight="bold" fill="#222">NAR correlation catalog</text>
  <text x="460" y="344" font-size="11" fill="#333">catalog.rs — in-memory map<tspan x="460" dy="14">token → (NarHash, NarSize)</tspan><tspan x="460" dy="14">learned from narinfos;</tspan><tspan x="460" dy="14">CorrelationStore: persisted</tspan><tspan x="460" dy="14">view via the disk cache</tspan></text>

  <!-- narsource seam -->
  <rect x="450" y="450" width="220" height="130" rx="6" fill="#e8eef7" stroke="#4a6fa5"/>
  <text x="460" y="468" font-size="12" font-weight="bold" fill="#222">NarSource (frozen seam)</text>
  <text x="460" y="484" font-size="11" fill="#333">resolve(NarKey, size bound)<tspan x="460" dy="14">→ verified NAR stream.</tspan><tspan x="460" dy="14">SignedNarHash {hash,</tspan><tspan x="460" dy="14">upstream_hint} on catalog</tspan><tspan x="460" dy="14">hit — the wave-2 p2p lookup</tspan><tspan x="460" dy="14">key; UpstreamPath on miss</tspan></text>

  <!-- raw passthrough -->
  <rect x="450" y="598" width="220" height="48" rx="6" fill="#e8eef7" stroke="#4a6fa5"/>
  <text x="460" y="616" font-size="12" font-weight="bold" fill="#222">RawUpstream passthrough</text>
  <text x="460" y="632" font-size="11" fill="#333">catch-all: ANY other path (e.g. log/*, *.ls)</text>

  <!-- upstream http -->
  <rect x="720" y="300" width="140" height="120" rx="6" fill="#e8eef7" stroke="#4a6fa5"/>
  <text x="730" y="318" font-size="12" font-weight="bold" fill="#222">UpstreamHttp</text>
  <text x="730" y="334" font-size="11" fill="#333">upstream.rs — the<tspan x="730" dy="14">ONLY HTTP-client</tspan><tspan x="730" dy="14">code in the daemon;</tspan><tspan x="730" dy="14">per-hop connect /</tspan><tspan x="730" dy="14">header timeouts</tspan></text>

  <!-- external upstream cache -->
  <rect x="920" y="290" width="240" height="140" rx="6" fill="#f2f2f2" stroke="#777"/>
  <text x="930" y="310" font-size="13" font-weight="bold" fill="#222">Upstream binary cache</text>
  <text x="930" y="327" font-size="11" fill="#333">cache.nixos.org (target; wave 1<tspan x="930" dy="14">is http-only, TLS = task-24) or</tspan><tspan x="930" dy="14">testproxy → mock origin (tests).</tspan><tspan x="930" dy="14">Sole metadata and trust</tspan><tspan x="930" dy="14">authority — signed narinfos</tspan><tspan x="930" dy="14">pass through untouched</tspan></text>

  <!-- wave-2 planned -->
  <rect x="890" y="470" width="250" height="150" rx="6" fill="#f6f0fa" stroke="#7a5a9a" stroke-dasharray="6 4"/>
  <text x="900" y="490" font-size="12" font-weight="bold" fill="#5a3f78">wave 2 (planned)</text>
  <text x="900" y="507" font-size="11" fill="#5a3f78">IrohNarSource behind a<tspan x="900" dy="14">Transport trait resolves</tspan><tspan x="900" dy="14">NarKey::SignedNarHash via</tspan><tspan x="900" dy="14">peers (wave-2 backlog) —</tspan><tspan x="900" dy="14">same seam, no serving-</tspan><tspan x="900" dy="14">layer change</tspan></text>

  <!-- arrows -->
  <line x1="160" y1="355" x2="214" y2="355" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="162" y="345" font-size="10" fill="#666">substituter</text>

  <line x1="300" y1="300" x2="300" y2="229" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <polyline points="380,320 405,320 405,170 446,170" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="412" y="250" font-size="10" fill="#666">*.narinfo</text>

  <polyline points="380,355 420,355 420,510 446,510" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="426" y="442" font-size="10" fill="#666">nar/&lt;token&gt;</text>

  <polyline points="300,410 300,622 446,622" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="306" y="505" font-size="10" fill="#666">other</text>

  <line x1="560" y1="230" x2="560" y2="306" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="568" y="268" font-size="10" fill="#666">learn at narinfo time</text>

  <line x1="560" y1="420" x2="560" y2="446" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="568" y="438" font-size="10" fill="#666">correlate on nar GET</text>

  <line x1="670" y1="215" x2="696" y2="215" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <polyline points="670,140 855,140 855,296" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="700" y="132" font-size="10" fill="#666">cache miss</text>

  <polyline points="670,480 800,480 800,424" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="670,622 830,622 830,424" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <line x1="860" y1="360" x2="916" y2="360" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="872" y="352" font-size="10" fill="#666">GET</text>

  <!-- legend -->
  <rect x="20" y="676" width="14" height="14" fill="#e8eef7" stroke="#4a6fa5"/>
  <text x="40" y="687" font-size="11" fill="#444">product code</text>
  <rect x="140" y="676" width="14" height="14" fill="#f2f2f2" stroke="#777"/>
  <text x="160" y="687" font-size="11" fill="#444">external / unchanged</text>
  <rect x="300" y="676" width="14" height="14" fill="#f6f0fa" stroke="#7a5a9a" stroke-dasharray="4 3"/>
  <text x="320" y="687" font-size="11" fill="#444">planned (wave 2)</text>
</svg>
