<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="aDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57534e"/></marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
  </defs>

  <rect width="1200" height="820" fill="#fafaf9"/>

  <text x="40" y="54" font-size="21" font-weight="700" fill="#1c1917">Candidate A — nginx URL-split proxy</text>
  <text x="40" y="80" font-size="13.5" fill="#78716c">Original sketch: route by URL suffix — metadata to the trusted cache, payload to a p2p fetcher</text>

  <!-- legend -->
  <line x1="860" y1="48" x2="892" y2="48" stroke="#d97706" stroke-width="2.5"/>
  <text x="900" y="52" font-size="11" fill="#57534e">trusted metadata (signed)</text>
  <line x1="860" y1="70" x2="892" y2="70" stroke="#0d9488" stroke-width="3"/>
  <text x="900" y="74" font-size="11" fill="#57534e">p2p payload (hash-verified)</text>
  <line x1="860" y1="92" x2="892" y2="92" stroke="#78716c" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="900" y="96" font-size="11" fill="#57534e">fallback / side channel</text>

  <!-- client machine group -->
  <rect x="50" y="125" width="690" height="420" rx="10" fill="none" stroke="#a8a29e" stroke-dasharray="4 4"/>
  <text x="66" y="150" font-size="12" fill="#78716c">your machine</text>

  <!-- nix-daemon -->
  <rect x="80" y="170" width="190" height="100" rx="8" fill="#ffffff" stroke="#a8a29e" stroke-width="1.4"/>
  <text x="175" y="198" font-size="14.5" font-weight="700" fill="#1c1917" text-anchor="middle">nix-daemon</text>
  <text x="175" y="220" font-size="10.5" fill="#57534e" text-anchor="middle" font-family="ui-monospace, monospace">substituter =</text>
  <text x="175" y="236" font-size="10.5" fill="#57534e" text-anchor="middle" font-family="ui-monospace, monospace">http://localhost:8080</text>
  <text x="175" y="258" font-size="10.5" font-style="italic" fill="#78716c" text-anchor="middle">verifies sig + NarHash</text>

  <!-- nginx -->
  <rect x="370" y="165" width="230" height="110" rx="8" fill="#ffffff" stroke="#78716c" stroke-width="1.6"/>
  <text x="485" y="192" font-size="14.5" font-weight="700" fill="#1c1917" text-anchor="middle">nginx :8080</text>
  <text x="485" y="216" font-size="10.5" fill="#57534e" text-anchor="middle" font-family="ui-monospace, monospace">~ \.narinfo$  → cache</text>
  <text x="485" y="233" font-size="10.5" fill="#57534e" text-anchor="middle" font-family="ui-monospace, monospace">/nar/  → p2p-fetcher</text>
  <text x="485" y="257" font-size="10.5" font-style="italic" fill="#78716c" text-anchor="middle">content-blind URL router</text>

  <!-- p2p-fetcher -->
  <rect x="370" y="390" width="230" height="120" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="485" y="417" font-size="14.5" font-weight="700" fill="#115e59" text-anchor="middle">p2p-fetcher daemon</text>
  <text x="485" y="439" font-size="11" fill="#115e59" text-anchor="middle">iroh-blobs + discovery</text>
  <text x="485" y="462" font-size="10.5" font-style="italic" fill="#78716c" text-anchor="middle">re-fetches each narinfo itself</text>
  <text x="485" y="478" font-size="10.5" font-style="italic" fill="#78716c" text-anchor="middle">to learn NarHash (duplicate RTT)</text>

  <!-- cache.nixos.org -->
  <rect x="860" y="165" width="290" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="1005" y="196" font-size="14.5" font-weight="700" fill="#92400e" text-anchor="middle">cache.nixos.org</text>
  <text x="1005" y="218" font-size="11" fill="#92400e" text-anchor="middle">narinfo + signatures</text>
  <text x="1005" y="236" font-size="10.5" fill="#b45309" text-anchor="middle">trusted — unchanged</text>

  <!-- iroh swarm -->
  <rect x="860" y="410" width="290" height="90" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
  <text x="1005" y="441" font-size="14.5" font-weight="700" fill="#115e59" text-anchor="middle">iroh swarm</text>
  <text x="1005" y="463" font-size="11" fill="#115e59" text-anchor="middle">untrusted peers — NAR payloads</text>
  <text x="1005" y="481" font-size="10.5" fill="#0f766e" text-anchor="middle">hash-verified on arrival</text>

  <!-- edges -->
  <line x1="270" y1="210" x2="370" y2="210" stroke="#57534e" stroke-width="1.6" marker-end="url(#aDark)"/>
  <text x="320" y="200" font-size="10.5" fill="#57534e" text-anchor="middle">HTTP GET</text>

  <line x1="600" y1="195" x2="860" y2="195" stroke="#d97706" stroke-width="2" marker-end="url(#aAmber)"/>
  <text x="730" y="186" font-size="11" fill="#92400e" text-anchor="middle">*.narinfo — passthrough</text>

  <line x1="485" y1="275" x2="485" y2="390" stroke="#57534e" stroke-width="1.6" marker-end="url(#aDark)"/>
  <text x="494" y="336" font-size="10.5" fill="#57534e" font-family="ui-monospace, monospace">proxy_pass /nar/*</text>

  <line x1="600" y1="460" x2="860" y2="460" stroke="#0d9488" stroke-width="3.5" marker-end="url(#aTeal)"/>
  <text x="730" y="450" font-size="11" fill="#115e59" text-anchor="middle">NAR bytes (BLAKE3-verified)</text>

  <path d="M600,420 L720,420 L720,300 L960,300 L960,255" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#aAmber)"/>
  <text x="742" y="276" font-size="10.5" fill="#92400e">narinfo re-fetch (learn NarHash)</text>
  <text x="742" y="292" font-size="10.5" fill="#92400e">+ NAR fallback on miss / timeout</text>

  <!-- assessment -->
  <rect x="40" y="580" width="1120" height="205" rx="10" fill="#f5f5f4" stroke="#e7e5e4"/>
  <text x="64" y="610" font-size="15" font-weight="700" fill="#1c1917">Assessment — works, but weakest of the three</text>
  <text x="64" y="640" font-size="14" font-weight="700" fill="#15803d">+</text>
  <text x="86" y="640" font-size="12.5" fill="#292524">Nix still verifies signature and NarHash itself — neither nginx nor the fetcher enters the trust base.</text>
  <text x="64" y="666" font-size="14" font-weight="700" fill="#15803d">+</text>
  <text x="86" y="666" font-size="12.5" fill="#292524">Metadata path is a stock nginx location block: zero custom code where trust matters.</text>
  <text x="64" y="692" font-size="14" font-weight="700" fill="#b91c1c">−</text>
  <text x="86" y="692" font-size="12.5" fill="#292524">Two processes; the fetcher is a full daemon anyway, so nginx adds a layer without removing one.</text>
  <text x="64" y="718" font-size="14" font-weight="700" fill="#b91c1c">−</text>
  <text x="86" y="718" font-size="12.5" fill="#292524">Proxy is content-blind: it cannot read NarHash at narinfo time — no speculative prefetch, and every narinfo is fetched twice.</text>
  <text x="64" y="744" font-size="14" font-weight="700" fill="#b91c1c">−</text>
  <text x="86" y="744" font-size="12.5" fill="#292524">Duplicates a built-in mechanism: Nix's substituters list already does ordered fallback (see Candidate B).</text>
</svg>
