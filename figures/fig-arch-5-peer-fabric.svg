<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="770" viewBox="0 0 1180 770" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1180" height="770" fill="#ffffff"/>

  <text x="20" y="32" font-size="18" font-weight="bold" fill="#222">nix-p2p — decentralize the bytes, not the trust</text>
  <text x="20" y="52" font-size="12" fill="#666">Unmodified Nix &#8596; localhost substituter. Signed metadata + trust stay at cache.nixos.org; only NAR bytes are decentralized, behind a backend-agnostic PeerFabric seam.</text>
  <text x="20" y="69" font-size="11" font-style="italic" fill="#999">Target architecture — the PeerFabric seam is a proposal (docs/peer-fabric-seam.md), not yet built; today's daemon is iroh, welded.</text>

  <!-- nix client -->
  <rect x="20" y="210" width="150" height="130" rx="6" fill="#f2f2f2" stroke="#777"/>
  <text x="30" y="230" font-size="13" font-weight="bold" fill="#222">Nix client</text>
  <text x="30" y="247" font-size="11" fill="#333">unmodified nix<tspan x="30" dy="14">adds daemon as the</tspan><tspan x="30" dy="14">preferred substituter</tspan><tspan x="30" dy="14" font-weight="bold" fill="#b7791f">re-verifies Sig +</tspan><tspan x="30" dy="14" font-weight="bold" fill="#b7791f">NarHash itself</tspan></text>

  <!-- nix <-> daemon -->
  <line x1="170" y1="255" x2="230" y2="255" stroke="#555" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="200" y="245" font-size="9" fill="#666" text-anchor="middle">binary-cache</text>
  <text x="200" y="273" font-size="9" fill="#666" text-anchor="middle">HTTP API</text>

  <!-- daemon container -->
  <rect x="230" y="90" width="560" height="430" rx="8" fill="#fbfcfe" stroke="#4a6fa5"/>
  <text x="242" y="110" font-size="13" font-weight="bold" fill="#4a6fa5">nix-p2p daemon (localhost substituter, Rust / tokio)</text>
  <text x="242" y="127" font-size="11" fill="#666">shipped as two binaries — <tspan font-family="monospace">daemon-iroh</tspan> | <tspan font-family="monospace">daemon-libp2p</tspan> — one backend each</text>

  <!-- frontend: daemon-core -->
  <rect x="250" y="140" width="520" height="150" rx="6" fill="#e8eef7" stroke="#4a6fa5"/>
  <text x="262" y="159" font-size="12" font-weight="bold" fill="#222"><tspan font-family="monospace">daemon-core</tspan> — frontend (stack-neutral serving core)</text>
  <text x="262" y="180" font-size="11" fill="#333">&#8226; <tspan font-family="monospace">NarinfoSource</tspan> — narinfo lookup (upstream HTTP + disk cache)</text>
  <text x="262" y="197" font-size="11" fill="#333">&#8226; <tspan font-family="monospace">NarSource</tspan> — resolve a NAR by content identity &#8594; verified byte stream</text>
  <text x="262" y="214" font-size="11" fill="#333">&#8226; <tspan font-family="monospace">RawUpstream</tspan> — <tspan font-family="monospace">log/*</tspan>, <tspan font-family="monospace">*.ls</tspan> passthrough</text>
  <text x="262" y="238" font-size="11" font-style="italic" fill="#2f855a">holds ZERO p2p types — compiles &amp; unit-tests against a FakeFabric</text>
  <text x="262" y="262" font-size="11" fill="#333">cacheinfo (priority 30 &lt; upstream 40) &#183; narinfo&#8594;NAR correlation catalog &#183;</text>
  <text x="262" y="278" font-size="11" fill="#333">crash-safe fallback (daemon down/killed &#8594; nix still builds via upstream)</text>

  <!-- PeerFabric seam -->
  <rect x="250" y="302" width="520" height="56" rx="6" fill="#fff4e0" stroke="#d69e2e"/>
  <text x="262" y="321" font-size="12" font-weight="bold" fill="#8a5a00"><tspan font-family="monospace">PeerFabric</tspan> — the P2P intention seam (7 capabilities)</text>
  <text x="262" y="341" font-size="11" fill="#7a4f00">find providers &#183; announce &#183; locate node &#183; fetch NAR &#183; serve NAR &#183; hold-query &#183; LAN</text>
  <text x="262" y="354" font-size="9.5" fill="#a06a00">MISS &#8800; UNAVAILABLE &#183; every leak recorded to one Exposure ledger</text>

  <!-- backend -->
  <rect x="250" y="370" width="520" height="132" rx="6" fill="#e6f4ea" stroke="#2f855a"/>
  <text x="262" y="389" font-size="12" font-weight="bold" fill="#22543d">backend — exactly ONE per binary (adopted, not invented)</text>
  <rect x="262" y="400" width="245" height="92" rx="5" fill="#ffffff" stroke="#2f855a"/>
  <text x="272" y="418" font-size="11" font-weight="bold" fill="#22543d" font-family="monospace">fabric-iroh</text>
  <text x="272" y="435" font-size="10.5" fill="#2f533d">iroh-blobs transfer (QUIC)</text>
  <text x="272" y="451" font-size="10.5" fill="#2f533d">iroh-dht-experiment (providers)</text>
  <text x="272" y="467" font-size="10.5" fill="#2f533d">pkarr / Mainline node lookup</text>
  <text x="272" y="483" font-size="10.5" font-style="italic" fill="#2f855a">primary</text>
  <rect x="517" y="400" width="243" height="92" rx="5" fill="#ffffff" stroke="#2f855a"/>
  <text x="527" y="418" font-size="11" font-weight="bold" fill="#22543d" font-family="monospace">fabric-libp2p</text>
  <text x="527" y="435" font-size="10.5" fill="#2f533d">libp2p-kad (put/get_record)</text>
  <text x="527" y="451" font-size="10.5" fill="#2f533d">Identify + Kademlia lookup</text>
  <text x="527" y="467" font-size="10.5" fill="#2f533d">libp2p request-response</text>
  <text x="527" y="483" font-size="10.5" font-style="italic" fill="#2f855a">fallback</text>

  <!-- cache.nixos.org -->
  <rect x="840" y="110" width="320" height="150" rx="6" fill="#efe6fb" stroke="#6b46c1"/>
  <text x="852" y="130" font-size="13" font-weight="bold" fill="#44337a">cache.nixos.org</text>
  <text x="852" y="150" font-size="11" fill="#3c2f6e">signed narinfo metadata (ed25519)</text>
  <text x="852" y="167" font-size="11" fill="#3c2f6e">the trust authority — UNCHANGED</text>
  <text x="852" y="184" font-size="11" fill="#3c2f6e">HTTP byte fallback (xz-compressed)</text>
  <rect x="852" y="200" width="150" height="24" rx="12" fill="#e2d6f7" stroke="#6b46c1"/>
  <text x="927" y="216" font-size="10.5" font-weight="bold" fill="#44337a" text-anchor="middle">TRUSTED (in TCB)</text>
  <text x="852" y="245" font-size="10" fill="#6b46c1">metadata always upstream (bandwidth offload, not outage resilience)</text>

  <!-- peer swarm -->
  <rect x="840" y="340" width="320" height="150" rx="6" fill="#e0f2f1" stroke="#319795"/>
  <text x="852" y="360" font-size="13" font-weight="bold" fill="#234e52">peer swarm</text>
  <text x="852" y="380" font-size="11" fill="#22484b">other nix-p2p daemons (untrusted)</text>
  <text x="852" y="397" font-size="11" fill="#22484b">NAR bytes over QUIC, BLAKE3/bao-verified</text>
  <text x="852" y="414" font-size="11" fill="#22484b">regenerate-on-demand supply (no copy at rest)</text>
  <rect x="852" y="430" width="150" height="24" rx="12" fill="#c9e9e7" stroke="#319795"/>
  <text x="927" y="446" font-size="10.5" font-weight="bold" fill="#234e52" text-anchor="middle">UNTRUSTED</text>
  <text x="852" y="475" font-size="10" fill="#319795">a bad/lying/dead peer &#8594; retry or upstream fallback, never a bad path</text>

  <!-- daemon -> cache (narinfo) -->
  <line x1="790" y1="175" x2="840" y2="175" stroke="#6b46c1" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="815" y="168" font-size="9" fill="#6b46c1" text-anchor="middle">narinfo (signed)</text>
  <!-- daemon -> cache (byte fallback) -->
  <line x1="790" y1="235" x2="840" y2="235" stroke="#6b46c1" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="815" y="228" font-size="9" fill="#6b46c1" text-anchor="middle">byte fallback</text>
  <!-- daemon backend -> swarm (bytes + discovery) -->
  <line x1="790" y1="410" x2="840" y2="410" stroke="#319795" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="815" y="403" font-size="9" fill="#319795" text-anchor="middle">NAR bytes</text>
  <text x="815" y="432" font-size="9" fill="#319795" text-anchor="middle">discovery:</text>
  <text x="815" y="443" font-size="9" fill="#319795" text-anchor="middle">NarHash&#8594;NodeId</text>

  <!-- ============ crate topology strip ============ -->
  <line x1="20" y1="540" x2="1160" y2="540" stroke="#ddd" stroke-width="1"/>
  <text x="20" y="560" font-size="13" font-weight="bold" fill="#4a6fa5">Crate topology — one backend per binary, shared stack-neutral frontend</text>

  <rect x="20" y="575" width="210" height="66" rx="6" fill="#eef2f9" stroke="#4a6fa5"/>
  <text x="30" y="594" font-size="11.5" font-weight="bold" fill="#222" font-family="monospace">peer-fabric</text>
  <text x="30" y="610" font-size="10" fill="#333">seam: traits + value types</text>
  <text x="30" y="624" font-size="10" fill="#333">Lookup / Exposure / FakeFabric</text>
  <text x="30" y="637" font-size="10" font-weight="bold" fill="#2f855a">NO p2p deps</text>

  <line x1="230" y1="608" x2="270" y2="608" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="270" y="575" width="210" height="66" rx="6" fill="#eef2f9" stroke="#4a6fa5"/>
  <text x="280" y="594" font-size="11.5" font-weight="bold" fill="#222" font-family="monospace">daemon-core</text>
  <text x="280" y="610" font-size="10" fill="#333">frontend: serving, policy,</text>
  <text x="280" y="624" font-size="10" fill="#333">correlation, budgets</text>
  <text x="280" y="637" font-size="10" font-weight="bold" fill="#2f855a">NO p2p deps</text>

  <line x1="480" y1="608" x2="520" y2="608" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="520" y="575" width="230" height="66" rx="6" fill="#e6f4ea" stroke="#2f855a"/>
  <text x="530" y="594" font-size="11.5" font-weight="bold" fill="#22543d" font-family="monospace">fabric-iroh</text>
  <text x="530" y="610" font-size="11.5" font-weight="bold" fill="#22543d" font-family="monospace">fabric-libp2p</text>
  <text x="530" y="626" font-size="10" fill="#333">= peer-fabric + one stack</text>
  <text x="530" y="639" font-size="10" fill="#333">(iroh / libp2p adopted)</text>

  <line x1="750" y1="608" x2="790" y2="608" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="790" y="575" width="230" height="66" rx="6" fill="#fbfcfe" stroke="#4a6fa5"/>
  <text x="800" y="594" font-size="11.5" font-weight="bold" fill="#222" font-family="monospace">daemon-iroh (bin)</text>
  <text x="800" y="610" font-size="11.5" font-weight="bold" fill="#222" font-family="monospace">daemon-libp2p (bin)</text>
  <text x="800" y="626" font-size="10" fill="#333">= daemon-core + ONE backend</text>
  <text x="800" y="639" font-size="10" fill="#333">one stack's dep closure each</text>

  <rect x="1040" y="575" width="120" height="66" rx="6" fill="#f7f7f7" stroke="#999" stroke-dasharray="4 3"/>
  <text x="1050" y="594" font-size="11" font-weight="bold" fill="#555" font-family="monospace">testproxy</text>
  <text x="1050" y="609" font-size="9.5" fill="#555">test fixture:</text>
  <text x="1050" y="621" font-size="9.5" fill="#555">fault injection</text>
  <text x="1050" y="635" font-size="9.5" font-style="italic" fill="#555">never in product</text>

  <!-- ============ footer notes ============ -->
  <text x="20" y="676" font-size="11" fill="#333"><tspan font-weight="bold">Intent</tspan> — decentralize only NAR bytes; signatures and trust remain cache.nixos.org's job. Bandwidth offload, not outage resilience.</text>
  <text x="20" y="700" font-size="11" fill="#333"><tspan font-weight="bold">Trust</tspan> — Nix re-verifies signature + NarHash, so the daemon and every peer sit OUTSIDE the trusted computing base (TCB); integrity never depends on them.</text>
  <text x="20" y="724" font-size="11" fill="#333"><tspan font-weight="bold">Discovery</tspan> — evidence-gated and ADOPTED (iroh-dht-experiment primary / libp2p-kad fallback), never hand-rolled. Frozen surface = our schema as an</text>
  <text x="20" y="740" font-size="11" fill="#333">opaque value inside the substrate, so substrate wire churn never touches the freeze. Full API + rationale: <tspan font-family="monospace">docs/peer-fabric-seam.md</tspan>.</text>
</svg>
