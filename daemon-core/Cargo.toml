[package]
name = "daemon-core"
description = "nix-p2p STACK-NEUTRAL serving frontend (TASK-146): the serving core (server/source/upstream/catalog/rewrite/narinfo_cache), correlation, claim/discovery/availability orchestration, and the generic PeerFabric-backed NarSource. Depends on peer-fabric + proc-supervisor ONLY - ZERO p2p-lib deps (no iroh, no libp2p, no fabric-* backend). The per-backend thin binaries (daemon-libp2p, daemon-iroh) are daemon-core + exactly one fabric-* crate; see docs/peer-fabric-seam.md 'Crate topology'."
version.workspace = true
edition.workspace = true

[lib]
name = "daemon_core"
path = "src/lib.rs"

[dependencies]
# peer-fabric (TASK-140/141): the intention-level P2P seam + the canonical home of the
# FROZEN value types (NodeId, Blake3Digest, ContentKey, ProviderRecord, TransportTag,
# InfoHash). The frontend reaches ANY backend ONLY through `Arc<dyn PeerFabric>` and the
# seam capability traits - never a concrete stack - which is what makes it stack-neutral.
peer-fabric = { path = "../peer-fabric" }
# proc-supervisor (TASK-146): the generic task/subprocess supervisor. The HTTP accept loop
# (`server::serve`) registers connections on a `TaskSupervisorHandle`, and NAR production
# (`availability`) runs `nix` subprocesses through `process_group`. Stack-neutral (no p2p).
proc-supervisor = { path = "../proc-supervisor" }

# HTTP stack (task-4 decision): tokio + hyper 1.x LOW-LEVEL client/server + body/util
# helpers. The serving core forwards bytes verbatim; hyper's low-level client does no
# auto-decompression. Same crates the monolith `daemon` used (the daemon now re-exports
# this crate), so the independence HTTP-stack denylist is unchanged.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "time", "sync"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
async-trait = "0.1"
# Claim wire format (task-37): serde derives on the versioned record + query envelope,
# JSON as the draft codec, fail-closed decode. DAEMON-SIDE only (testproxy stays std-only).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS upstream client (TASK-24): front cache.nixos.org over https on the SAME
# `UpstreamHttp::send` path, preserving verbatim byte forwarding + no
# auto-decompression. rustls over `ring` (the crypto provider iroh already locks;
# `default-features = false` + `ring` keeps aws-lc-rs OUT of the closure and the
# Cargo.lock unchanged). tokio-rustls wraps the TCP stream BEFORE hyper's http1
# handshake. webpki-roots supplies the Mozilla public-CA trust anchors as a
# COMPILED-IN, filesystem-free bundle (deterministic + Nix-sandbox-safe) that
# reaches the real CDN; `UpstreamHttp::with_root_store` accepts operator/fixture
# roots for the "configured roots" path. The default rustls WebPkiServerVerifier
# validates the chain AND the hostname/SNI - there is NO insecure-skip-verify in
# any production API (AC#3). DAEMON-SIDE and NOT an HTTP-logic crate, so the
# independence HTTP-stack denylist is unaffected; TASK-22 (testproxy TLS) MUST
# adopt a DIFFERENT TLS crate so the fixture stays an independent wire witness.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
# BLAKE3 of the addressed unit (task-48 freeze): the raw-NAR content identity recipe.
blake3 = "1"
# sha256 of the raw NAR = the Nix NarHash (task-56): the availability index re-derives
# it from the SAME --dump bytes it BLAKE3s and asserts it equals the registered
# NarHashKey, so a mis-registration is quarantined at the source rather than becoming a
# false claim. DAEMON-SIDE only; the independence denylist is the HTTP stack, not this.
sha2 = "0.10"
# availability's NAR reader opens the raw store path with descriptor-relative, no-follow,
# regular-file-checked filesystem ops (openat/fstat) without unsafe code. Not a p2p dep.
# The public-allowlist store (TASK-102) reuses it for the strict owner/mode/type/link
# checks (openat NOFOLLOW + fstat) on its append-only file, and geteuid for the owner check.
rustix = { version = "1", features = ["fs", "process"] }
# TASK-102 public-NAR allowlist: verify a cache.nixos.org narinfo's trusted-key Nix ed25519
# signature over the fingerprint `1;StorePath;NarHash;NarSize;References` before a NAR's
# identity may be published. ed25519-dalek v3 `verify_strict` is the SAME strict verifier
# peer-fabric's ProviderRecord codec uses (small-order A/R + S<L rejected), so the two agree
# on which signatures are valid. base64 decodes the Nix `name:<base64>` key + Sig tokens.
# Neither is a p2p stack nor an HTTP-logic crate, so the independence denylist is unaffected.
ed25519-dalek = "3"
base64 = "0.22"

[dev-dependencies]
# The serving-core in-process integration tests moved here with the modules; several stand
# up fake NAR sources + drive time.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "time", "sync", "test-util"] }
# TASK-24 TLS tests: a fixture CA (rcgen, ring backend - default features are
# already ring-based, pinned explicit here so a future rcgen default cannot pull
# aws-lc-rs) issues a valid-hostname leaf plus the wrong-hostname / expired /
# untrusted-self-signed negatives, driven against an in-process tokio-rustls
# server. flate2 builds a REAL gzip body for the verbatim-over-TLS bite (a
# decoding layer would change the bytes; hyper's low-level client has none).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
flate2 = "1"

[lints]
workspace = true
