[workspace]
resolver = "3"
# Two strictly separated binaries (PRD "Two components, strictly separated"):
#   daemon    - the product; modular, capabilities behind traits.
#   testproxy - the test fixture; simple, hardcoding allowed, owns fault
#               injection. Never depended on by the daemon, and vice versa.
# There is deliberately no shared crate: per PRD round 5/6 sharing is limited
# to low-level pure-data crates, and only once a second consumer actually
# exists. `just lint` asserts that independence mechanically.
# peer-fabric (TASK-140) is a daemon-SIDE seam crate: the intention-level P2P
# abstraction the daemon-core/fabric-* crates build on (TASK-141). It carries ZERO
# p2p deps. fabric-iroh (TASK-144) is the iroh BACKEND behind that seam - the iroh
# node-runtime/discovery/publication weld isolated out of the daemon; it depends on
# peer-fabric (never on the daemon) and the daemon depends on it (one-way edge).
# Both are shared only AMONG the daemon's own components; testproxy shares nothing
# with either, so `just independence` stays green.
# mainline-rendezvous (TASK-258 SPIKE): the BitTorrent Mainline DHT peer-address
# rendezvous prototype. A separate workspace member (not depended on by the shipped
# discovery crates yet — adoption is gated on the spike's decision) so `just build`,
# `just test` and `just audit` all exercise it and its new `mainline` supply-chain edge.
members = ["daemon", "daemon-core", "daemon-libp2p", "fabric-iroh", "fabric-libp2p", "mainline-rendezvous", "peer-fabric", "proc-supervisor", "testproxy", "vendor/libp2p-stream"]
# Iroh is a crates.io patch used by production, but not a workspace member:
# its upstream integration suite reaches staging DNS/relays and Linux network
# namespaces. Canonical gates exercise our focused vendored regression explicitly.
exclude = ["vendor/iroh"]

# TASK-219: crates.io libp2p-stream 0.4.0-alpha chooses a random connection for a peer and exposes
# no exact-ConnectionId stream-open API. The tiny upstream crate is vendored verbatim (MIT,
# provenance in vendor/libp2p-stream/README.md) with a narrow exact-open method and matching
# sender cleanup so a signature-authorized route cannot be substituted or reused after closure.
[patch.crates-io]
iroh = { path = "vendor/iroh" }
libp2p-stream = { path = "vendor/libp2p-stream" }

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

# Debug-info split for disk (dev profile). Most of `target/debug/deps` is dependency
# DEBUG INFO, not code. Dependencies build with line-tables-only (`debug = 1`) — enough for
# backtraces, a fraction of the size — while our OWN crates keep full `debug = 2` for
# stepping/variable inspection. Done as base=1 + explicit per-member overrides (NOT the
# `package."*"` glob, whose treatment of workspace members is version-ambiguous). `[profile]`
# is only honoured in the workspace ROOT. Reclaim stale artifacts with `just reclaim`
# (cargo-sweep), never a full target wipe.
[profile.dev]
debug = 1

[profile.dev.package.daemon]
debug = 2
[profile.dev.package.daemon-core]
debug = 2
[profile.dev.package.daemon-libp2p]
debug = 2
[profile.dev.package.fabric-iroh]
debug = 2
[profile.dev.package.fabric-libp2p]
debug = 2
[profile.dev.package.peer-fabric]
debug = 2
[profile.dev.package.proc-supervisor]
debug = 2
[profile.dev.package.testproxy]
debug = 2
[profile.dev.package.mainline-rendezvous]
debug = 2
