[workspace]
resolver = "3"
# Two strictly separated binaries (PRD "Two components, strictly separated"):
#   daemon    - the product; modular, capabilities behind traits.
#   testproxy - the test fixture; simple, hardcoding allowed, owns fault
#               injection. Never depended on by the daemon, and vice versa.
# There is deliberately no shared crate: per PRD round 5/6 sharing is limited
# to low-level pure-data crates, and only once a second consumer actually
# exists. `just lint` asserts that independence mechanically.
# peer-fabric (TASK-140) is a daemon-SIDE seam crate: the intention-level P2P
# abstraction the daemon-core/fabric-* crates build on (TASK-141). It carries ZERO
# p2p deps. fabric-iroh (TASK-144) is the iroh BACKEND behind that seam - the iroh
# node-runtime/discovery/publication weld isolated out of the daemon; it depends on
# peer-fabric (never on the daemon) and the daemon depends on it (one-way edge).
# Both are shared only AMONG the daemon's own components; testproxy shares nothing
# with either, so `just independence` stays green.
members = ["daemon", "fabric-iroh", "fabric-libp2p", "peer-fabric", "proc-supervisor", "testproxy"]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"
