[package]
name = "daemon"
description = "nix-p2p product daemon: localhost Nix binary-cache substituter"
version.workspace = true
edition.workspace = true

# Library + thin binary: the library holds all behaviour so the in-process
# integration tests drive the exact stack the binary runs.
[lib]
name = "daemon"
path = "src/lib.rs"

[features]
default = []
# Adversarial signed-record server used only inside the routed TASK-138 image,
# plus the TASK-142 relay evidence binaries (a locally operated iroh relay
# server runner and a relay-only peer). Production packages do not build or
# install these binaries. `iroh/test-utils` (enabled ONLY here) turns on
# iroh-relay's `server` + `test-utils` features so the relay server can be run
# in-process against a self-signed cert and the peer can trust it with
# `CaTlsConfig::insecure_skip_verify()`. Kept feature-gated so the heavy relay
# server dependency tree (rcgen/axum/...) never enters the production closure.
evidence-fixture = ["dep:iroh-relay", "iroh/test-utils"]

[[bin]]
name = "daemon"
path = "src/main.rs"

[[bin]]
name = "iroh-node-authority"
path = "src/bin/iroh_node_authority.rs"

[[bin]]
name = "iroh-node-lookup"
path = "src/bin/iroh_node_lookup.rs"

[[bin]]
name = "iroh-node-lookup-fixture"
path = "src/bin/iroh_node_lookup_fixture.rs"
required-features = ["evidence-fixture"]

# TASK-142 routed relay-capability evidence binaries. Both are feature-gated out
# of production: `iroh-relay-evidence-server` runs a locally operated iroh relay
# (self-signed cert), and `iroh-relay-evidence-peer` drives one relay-only
# connect/accept across L3-blocked namespaces, classifying the path via
# `daemon::classify_connection_path`.
[[bin]]
name = "iroh-relay-evidence-server"
path = "src/bin/iroh_relay_evidence_server.rs"
required-features = ["evidence-fixture"]

[[bin]]
name = "iroh-relay-evidence-peer"
path = "src/bin/iroh_relay_evidence_peer.rs"
required-features = ["evidence-fixture"]

# HTTP stack (task-4 decision): tokio + hyper 1.x LOW-LEVEL client/server, plus
# body/util helpers. NOT axum/tower (a framework the wave-0 skeleton does not
# need) and NOT reqwest (whose default gzip feature is the auto-decompression
# trap AC#6 guards against). hyper's low-level client does no auto-decompression,
# so verbatim byte forwarding is correct by construction. Chosen INDEPENDENTLY of
# testproxy's std-only hand-roll so the fixture stays an independent witness of
# wire behaviour (PRD round 5); the hyper-stack crate names are in
# scripts/check-independence.py's denylist so convergence is a mechanical gate.
[dependencies]
# peer-fabric (TASK-140/141): the intention-level P2P seam and the CANONICAL HOME
# of the shared value types (NodeId, Blake3Digest, TransportTag, InfoHash,
# TransportOffer). TASK-141 deleted the daemon's former duplicate definitions of
# these and re-points here; the daemon's `content_id`/`transport`/`transport_fetch`
# modules now re-export peer-fabric's copies, keeping their freeze narratives and
# conformance tests as the cross-crate equivalence guard. This is a daemon-SIDE
# crate (testproxy depends on none of it), so `just independence` stays green.
peer-fabric = { path = "../peer-fabric" }
# fabric-iroh (TASK-144 inc 1): the iroh BACKEND crate. The node-discovery /
# runtime / publication cluster (iroh_runtime, iroh_node_*, iroh_publication*,
# iroh_relay, pinned_http) and the generic process supervisor moved here behind
# the peer-fabric seam; the daemon re-exports them (src/lib.rs) so existing
# use-sites and the evidence bins are untouched. Daemon-SIDE (testproxy depends
# on none of it), so `just independence` stays green. The edge is one-way:
# daemon -> fabric-iroh, never back.
fabric-iroh = { path = "../fabric-iroh" }
# fabric-libp2p (TASK-160): the libp2p BACKEND crate - the MANDATORY decentralized
# content-discovery layer (libp2p-kad ProviderDirectory / AvailabilityAnnouncer)
# plus the libp2p NAR transfer/serve (TASK-151), all behind the peer-fabric seam.
# Wired into the p2p NarSource (`source_libp2p::Libp2pNarSource`) so the daemon can
# discover a provider via kad and fetch+BLAKE3-verify the NAR. This is the INTERIM
# both-backends link ahead of the clean per-binary daemon-core split (TASK-145/146);
# the edge is one-way (daemon -> fabric-libp2p) and daemon-SIDE, so `just
# independence` stays green (testproxy depends on none of it).
fabric-libp2p = { path = "../fabric-libp2p" }
# `sync` (task-72): the on-demand supply path needs SINGLE FLIGHT - when two peers
# ask for the same absent digest at once, exactly one regenerates and the other
# waits for its verdict. `tokio::sync::watch` carries the state as well as the
# edge, so a follower arriving after the leader published cannot miss the wakeup
# and hang. A bare notification has that lost-wakeup window; a poll loop does not,
# but spends latency to avoid it. No new crate - tokio is already here.
# `signal` (TASK-115): SIGINT/SIGTERM must drive the daemon-owned Iroh runtime's
# bounded shutdown path; dropping the runtime at process teardown would bypass
# handler cancellation and the named deadline.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "time", "sync", "signal", "process"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
async-trait = "0.1"
# Claim wire format (task-37): serde derives on the versioned record + query
# envelope, JSON as the draft codec. DAEMON-ONLY on purpose - testproxy stays
# std-only (an independent witness of wire behaviour), so these are never shared.
# Not HTTP-stack crates, so `just independence`'s convergence denylist is
# unaffected; the manifest guard only forbids a shared WORKSPACE crate.
# serde_json is a normal (not dev) dep: the claim decoder uses it to peek the
# payload/transport discriminator and to reject duplicate keys (fail-closed, one
# canonical parse) - not only in tests. There is NO public serde_json::Value
# catch-all: unknown kinds are tolerated-but-inert, nothing is retained.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# BLAKE3 of the addressed unit (task-48 freeze): the raw-NAR content identity.
# DAEMON-ONLY on purpose - testproxy stays std-only (an independent witness of
# wire behaviour), so this is never shared. Default features only (std, no
# rayon): the identity is computed one-shot, and pulling rayon would widen the
# closure for no benefit. Not an HTTP-stack crate, so the independence
# convergence denylist is unaffected. The addressed unit is BLAKE3(RawNarV1) with
# NO domain separation, so this crate's plain `hash()` IS the frozen recipe and a
# future iroh transport can address blobs by exactly this digest (see content_id).
blake3 = "1"
# iroh p2p transport (task-39): the FIRST real peer-to-peer byte transfer. A node
# runs an iroh-blobs PROVIDER serving its NARs addressed by BLAKE3(RawNarV1), and a
# CLIENT that fetches a blob by that exact Blake3Digest from a peer EndpointId.
# iroh-blobs speaks plain-unkeyed BLAKE3 (bao) so the addressed unit IS the blob
# hash (content_id.rs freeze) and the transfer is BLAKE3-verified incrementally
# (gate 1) for free. DAEMON-ONLY on purpose: testproxy stays std-only (an
# independent witness of wire behaviour), so these are never shared. Neither is an
# HTTP-stack crate, so `just independence`'s convergence denylist is unaffected -
# the guard only forbids a shared WORKSPACE crate or a shared HTTP stack.
# iroh-blobs 0.103 depends on iroh ^1.0, so the two majors are pinned together in
# Cargo.lock. n0 relay dependence for WAN holepunch is a known soft-centralization
# limit (PRD); the daemon dials direct addresses where it has them.
iroh = "1"
iroh-blobs = "0.103"
# TASK-137 node-address publication reuses Iroh's pkarr signed-packet wire
# format, but deliberately owns durability, acknowledgement and lifecycle.
# `simple-dns` is needed because the interoperable `_iroh` address records and
# the stricter nix-p2p metadata live at different names inside one signature.
iroh-dns = "1"
simple-dns = "0.11"
url = "2.5"
# TASK-142: a locally operated iroh relay SERVER for the routed relay-capability
# evidence. OPTIONAL and enabled only by the `evidence-fixture` feature, so the
# relay-server dependency tree (rcgen/dashmap/axum/tokio-websockets/...) is
# entirely absent from the production daemon closure. Pinned to the exact 1.0.3
# already in Cargo.lock alongside iroh; enabling `server`/`test-utils` only turns
# on features of that same version.
iroh-relay = { version = "1", optional = true, features = ["server", "test-utils"] }
# task-51 safety envelope: the signed-NarSize abort must fire DURING the transfer,
# so we drive `get_blob` as a STREAM (leaf-by-leaf) and stop the moment cumulative
# bytes exceed the signed NarSize - never buffer a huge lying blob then check.
# `bao-tree` names the leaf item the stream yields; `n0-future`'s `StreamExt` is the
# exact `Stream` driver iroh-blobs itself uses. Both are already transitive under
# iroh-blobs (no new closure), daemon-only, and non-HTTP-stack (the independence
# convergence denylist is unaffected).
bao-tree = "0.16"
n0-future = "0.3"
# TASK-115 identity persistence uses descriptor-relative, no-follow filesystem
# operations. `std::fs::rename` may overwrite a concurrently-created identity,
# and path-based validation has a symlink-swap window. rustix is already in the
# locked Iroh closure; making it direct lets us use openat + renameat2(NOREPLACE)
# without unsafe code or a second implementation of the race-sensitive parts.
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
# peer-fabric (TASK-148): integration tests name the seam directly to fetch an
# IrohTransport through the `peer_fabric::NarTransfer` trait (not the daemon
# `Transport` bridge), proving the de-welded transfer axis is reachable stack-
# neutrally. peer-fabric is already a normal dependency; a test crate is a separate
# crate, so it must also be a dev-dependency to be nameable in tests/.
peer-fabric = { path = "../peer-fabric" }
# fabric-libp2p (TASK-160): the daemon<->libp2p integration test stands up real
# in-process libp2p nodes (bootstrap + serving provider + consumer) to prove the
# Libp2pNarSource discovers a provider via kad and fetches through the daemon
# serving stack. A regular dependency too (the daemon links it), but named directly
# in tests/, so it is also a dev-dependency (mirroring peer-fabric above).
fabric-libp2p = { path = "../fabric-libp2p" }
# ed25519-dalek (TASK-160): the integration test signs the provider's
# ProviderRecord with the SAME ed25519 seed the provider node's identity is built
# from (self-serve), via `peer_fabric::sign_provider_record`. Version "3" matches
# peer-fabric's, so `SigningKey` is the one shared type across the seam.
ed25519-dalek = "3"
# process: spawn the real testproxy binary for the fault-mode loop (AC#2).
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "time", "process", "test-util"] }
# flate2: build a real gzip body for the AC#6 verbatim-forwarding bite.
flate2 = "1"
# sha2: model NIX's sha256==NarHash TRUST gate (gate 2) in the iroh transfer test.
# Test-only: the daemon never re-implements Nix's gate (it is outside the TCB);
# the test computes sha256 exactly as the Nix client would, to prove gate 2 is a
# DIFFERENT gate from the BLAKE3 transport gate (the corruption-bite split).
sha2 = "0.10"
# iroh (task-51): the body-idle bite needs a PATHOLOGICAL provider that establishes
# the QUIC connection then STALLS mid-transfer - a hostile peer the friendly public
# API (IrohProvider) deliberately cannot express. Building one needs a custom
# ProtocolHandler at the iroh layer, so the safety-envelope test reaches for `iroh`
# directly (only that one test does; the rest stay on the daemon's public API).
iroh = "1"

[lints]
workspace = true
