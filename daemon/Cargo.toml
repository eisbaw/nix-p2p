[package]
name = "daemon"
description = "nix-p2p product daemon: localhost Nix binary-cache substituter"
version.workspace = true
edition.workspace = true

# Library + thin binary: the library holds all behaviour so the in-process
# integration tests drive the exact stack the binary runs.
[lib]
name = "daemon"
path = "src/lib.rs"

[[bin]]
name = "daemon"
path = "src/main.rs"

# HTTP stack (task-4 decision): tokio + hyper 1.x LOW-LEVEL client/server, plus
# body/util helpers. NOT axum/tower (a framework the wave-0 skeleton does not
# need) and NOT reqwest (whose default gzip feature is the auto-decompression
# trap AC#6 guards against). hyper's low-level client does no auto-decompression,
# so verbatim byte forwarding is correct by construction. Chosen INDEPENDENTLY of
# testproxy's std-only hand-roll so the fixture stays an independent witness of
# wire behaviour (PRD round 5); the hyper-stack crate names are in
# scripts/check-independence.py's denylist so convergence is a mechanical gate.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "time"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
async-trait = "0.1"
# Claim wire format (task-37): serde derives on the versioned record + query
# envelope, JSON as the draft codec. DAEMON-ONLY on purpose - testproxy stays
# std-only (an independent witness of wire behaviour), so these are never shared.
# Not HTTP-stack crates, so `just independence`'s convergence denylist is
# unaffected; the manifest guard only forbids a shared WORKSPACE crate.
# serde_json is a normal (not dev) dep: the claim decoder uses it to peek the
# payload/transport discriminator and to reject duplicate keys (fail-closed, one
# canonical parse) - not only in tests. There is NO public serde_json::Value
# catch-all: unknown kinds are tolerated-but-inert, nothing is retained.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# BLAKE3 of the addressed unit (task-48 freeze): the raw-NAR content identity.
# DAEMON-ONLY on purpose - testproxy stays std-only (an independent witness of
# wire behaviour), so this is never shared. Default features only (std, no
# rayon): the identity is computed one-shot, and pulling rayon would widen the
# closure for no benefit. Not an HTTP-stack crate, so the independence
# convergence denylist is unaffected. The addressed unit is BLAKE3(RawNarV1) with
# NO domain separation, so this crate's plain `hash()` IS the frozen recipe and a
# future iroh transport can address blobs by exactly this digest (see content_id).
blake3 = "1"
# iroh p2p transport (task-39): the FIRST real peer-to-peer byte transfer. A node
# runs an iroh-blobs PROVIDER serving its NARs addressed by BLAKE3(RawNarV1), and a
# CLIENT that fetches a blob by that exact Blake3Digest from a peer EndpointId.
# iroh-blobs speaks plain-unkeyed BLAKE3 (bao) so the addressed unit IS the blob
# hash (content_id.rs freeze) and the transfer is BLAKE3-verified incrementally
# (gate 1) for free. DAEMON-ONLY on purpose: testproxy stays std-only (an
# independent witness of wire behaviour), so these are never shared. Neither is an
# HTTP-stack crate, so `just independence`'s convergence denylist is unaffected -
# the guard only forbids a shared WORKSPACE crate or a shared HTTP stack.
# iroh-blobs 0.103 depends on iroh ^1.0, so the two majors are pinned together in
# Cargo.lock. n0 relay dependence for WAN holepunch is a known soft-centralization
# limit (PRD); the daemon dials direct addresses where it has them.
iroh = "1"
iroh-blobs = "0.103"

[dev-dependencies]
# process: spawn the real testproxy binary for the fault-mode loop (AC#2).
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "time", "process"] }
# flate2: build a real gzip body for the AC#6 verbatim-forwarding bite.
flate2 = "1"
# sha2: model NIX's sha256==NarHash TRUST gate (gate 2) in the iroh transfer test.
# Test-only: the daemon never re-implements Nix's gate (it is outside the TCB);
# the test computes sha256 exactly as the Nix client would, to prove gate 2 is a
# DIFFERENT gate from the BLAKE3 transport gate (the corruption-bite split).
sha2 = "0.10"

[lints]
workspace = true
