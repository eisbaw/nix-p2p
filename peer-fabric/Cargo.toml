[package]
name = "peer-fabric"
description = "nix-p2p intention-level P2P seam: what the daemon wants of any peer substrate, with ZERO iroh/libp2p dependencies"
version.workspace = true
edition.workspace = true

[lib]
name = "peer_fabric"
path = "src/lib.rs"

# THE WHOLE POINT of this crate (AC#8): the seam names WHAT the daemon wants of a
# peer substrate, never HOW a stack does it, so it carries NO p2p stack. iroh and
# libp2p live only in the future `fabric-iroh` / `fabric-libp2p` backend crates
# (TASK-141+), never here. `just independence`'s HTTP-stack denylist is unaffected
# (this is neither an HTTP-stack crate nor reachable from testproxy).
[dependencies]
# The traits are async and object-safe (`Arc<dyn ProviderDirectory>`), exactly like
# the daemon's `NarSource`/`Transport` seams. `async-trait` boxes each call; that is
# also why the dispatch model is dynamic (docs/peer-fabric-seam.md) - every axis is
# I/O-bound, so a vtable hop is unmeasurable. No runtime is a *normal* dep: the one
# piece of shared state, the ExposureLedger, uses `std::sync::Mutex`.
async-trait = "0.1"
# TASK-141: the canonical value types moved here (this crate is their home), and
# they carry the FROZEN wire behaviour the daemon used to own - so their codec deps
# come with them. NEITHER is a p2p stack (the AC#8 "no iroh/libp2p" invariant is
# intact); iroh/libp2p still live only in the future fabric-* backend crates.
#   * blake3: `Blake3Digest::from_raw_nar` IS the frozen BLAKE3(RawNarV1) content
#     identity recipe (was daemon::content_id). It must equal the iroh-blobs blob
#     hash, so the recipe is plain unkeyed BLAKE3 - see ids.rs.
#   * serde: NodeId/Blake3Digest/InfoHash serialise to their canonical string forms
#     on the claim wire; the daemon's claim codec consumes these impls, and the
#     orphan rule forbids the daemon adding them to a foreign type - so they must
#     live at the type's home. content.rs (ContentKey/ProviderRecord) stays
#     serde-FREE: TASK-126 freezes that codec against the adopted backend.
blake3 = "1"
serde = { version = "1", features = ["derive"] }
# TASK-99: peer-LINK compression codec (negotiated zstd, raw fallback). Lives here so the
# codec + its integrity bites (bounded streaming decode, bomb/corruption/truncation) are
# TRANSPORT-AGNOSTIC and shared by every fabric backend below the seam - the compressed
# bytes are an UNSIGNED transport encoding; the addressed unit stays BLAKE3(RawNarV1). zstd
# is NOT a p2p stack (AC#8 intact) and NOT an HTTP-stack crate; it is unreachable from the
# std-only `testproxy`, so `scripts/check-independence.py` needs no allowlist/denylist
# change (daemon may reach it transitively, testproxy never does - no shared convergence).
zstd = "0.13"
# TASK-126: the frozen ProviderRecord opaque value is an ed25519-SIGNED byte blob,
# and its fail-closed decode VERIFIES the signature in-crate (the provider NodeId IS
# the verifying key), so the "bad-signature fails closed" freeze rule is real and
# testable here rather than deferred. ed25519-dalek is NOT a p2p stack (the AC#8
# "no iroh/libp2p" invariant is intact); it is already in the workspace lock via
# iroh, so this direct dep reuses the pinned version with no new source.
ed25519-dalek = "3"
# TASK-100 AC#3: the seam ENFORCES the caller's TOTAL discovery deadline with a real
# outer timeout (so a budget-IGNORING or hostile adapter is CUT at the deadline rather
# than hanging the Nix build path - the whole point of the PROBE_TIMEOUT/TASK-40/106
# latency-on-build-path invariant). That needs a timer, so tokio's `time` feature is a
# real dep here. This is NOT a P2P stack (the AC#8 no-iroh/libp2p invariant is intact)
# and NOT the HTTP stack `just independence` forbids (that denylist targets
# {rustls,tokio-rustls}); plain tokio is already in the workspace lock via the daemon.
tokio = { version = "1", default-features = false, features = ["time"] }
# TASK-62: the streaming store-and-forward NAR contract ([`stream::NarStream`]) yields
# verified raw leaves as `bytes::Bytes` so the libp2p backend can hand a leaf toward the
# HTTP body without a re-copy. `bytes` is NOT a p2p/HTTP stack (AC#8 + independence
# denylist intact) and is already in the workspace lock via the daemon/http body types.
bytes = "1"

[dev-dependencies]
# Only the tests need an async runtime, to `.await` the trait methods. `macros` for
# `#[tokio::test]`, `rt` for a current-thread executor. No `net`, no `process`: the
# seam is substrate-free and so are its tests (FakeFabric is the only backend).
tokio = { version = "1", features = ["macros", "rt", "time"] }
# The ids codec tests round-trip the canonical string forms through JSON, exactly
# as the daemon's claim wire does, so the frozen encodings are pinned here too.
serde_json = "1"
# BROAD-cadence signed-record decode+verify fuzz target (TASK-282 AC#4, src/fuzz.rs):
# proptest gives generation + SHRINKING + a committed proptest-regressions corpus on
# the pinned STABLE toolchain. Already in Cargo.lock via daemon-core.
proptest = "1"

[lints]
workspace = true
